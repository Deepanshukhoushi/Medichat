<div class="glass-card p-6 sm:p-7">
  <div class="mb-6 flex items-start justify-between gap-4">
    <div>
      <h3 class="text-xl font-semibold text-ink">{{ title() }}</h3>
      @if (subtitle()) {
        <p class="mt-2 text-sm text-secondary">{{ subtitle() }}</p>
      }
    </div>
  </div>

  @if (mode() === 'line') {
    <!--
      Bug fix: [colors] and [grid] were hardcoded hex values (light-theme token literals).
      Now bound to theme-reactive signals that re-resolve via getComputedStyle on theme change.
    -->
    <apx-chart
      [chart]="lineChartOptions()"
      [series]="lineSeries()"
      [stroke]="lineStroke"
      [xaxis]="lineXAxis"
      [colors]="lineColors()"
      [fill]="{ type: 'gradient', gradient: { opacityFrom: 0.32, opacityTo: 0.02 } }"
      [dataLabels]="{ enabled: false }"
      [grid]="lineGrid()"
      [legend]="{ show: true }"
    />
  } @else {
    <apx-chart
      [chart]="donutChartOptions()"
      [series]="donutSeries()"
      [labels]="donutLabels()"
      [colors]="donutColors()"
      [dataLabels]="{ enabled: false }"
      [legend]="{ position: 'bottom' }"
      [responsive]="donutResponsive"
      [stroke]="{ width: 0 }"
    />
  }
</div>
