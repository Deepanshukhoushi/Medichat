@if (visible()) {
  <div
    role="dialog"
    aria-labelledby="cookie-consent-title"
    aria-describedby="cookie-consent-desc"
    class="fixed bottom-0 left-0 right-0 z-[9999] p-4 sm:p-6 animate-fade-up"
  >
    <div class="mx-auto max-w-4xl glass-card bg-surface/95 backdrop-blur-xl border border-line/80 rounded-2xl shadow-card px-5 py-4 sm:px-6 sm:py-5 flex flex-col sm:flex-row items-start sm:items-center gap-4 sm:gap-6">
      <!-- Icon -->
      <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-accent/10 border border-accent/20">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-accent" aria-hidden="true">
          <path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z"/><path d="M12 7v5"/><path d="M12 15h.01"/>
        </svg>
      </div>

      <!-- Text -->
      <div class="flex-1 min-w-0">
        <p id="cookie-consent-title" class="text-sm font-semibold text-ink">We use cookies</p>
        <p id="cookie-consent-desc" class="mt-0.5 text-xs text-secondary leading-relaxed">
          We use essential cookies to keep you logged in and protect your session. With your consent, we may also use analytics cookies to improve the platform.
          <a routerLink="/legal/privacy" class="text-accent hover:underline ml-1">Privacy Policy</a>
        </p>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-2.5 shrink-0 w-full sm:w-auto">
        <button
          id="cookie-decline-btn"
          type="button"
          class="flex-1 sm:flex-none secondary-button h-9 px-4 text-xs"
          (click)="decline()"
        >
          Decline
        </button>
        <button
          id="cookie-accept-btn"
          type="button"
          class="flex-1 sm:flex-none primary-button h-9 px-4 text-xs"
          (click)="accept()"
        >
          Accept
        </button>
      </div>
    </div>
  </div>
}
