<div class="flex w-full flex-col gap-2 relative z-10" (focusin)="focusStateChange.emit(true)" (focusout)="handleFocusOut($event)">
  
  @if (uploadToast()) {
    <div class="rounded-xl border border-line bg-surface px-4 py-2 text-center text-xs text-secondary transition-all shadow-sm" aria-live="polite" role="status">
      {{ uploadToast() }}
    </div>
  }

  @if (voiceToast()) {
    <div class="rounded-xl border border-accent/20 bg-accent/10 px-4 py-2 text-center text-xs text-accent font-medium transition-all shadow-sm" aria-live="polite" role="status">
      🎤 Voice input is coming soon
    </div>
  }

  <!-- Main Composer -->
  <div class="flex items-center w-full bg-surface border border-line rounded-full px-6 py-3 shadow-lg focus-within:border-accent focus-within:ring-1 focus-within:ring-accent focus-within:shadow-[0_0_20px_rgba(20,184,166,0.15)] transition-all relative">
    
    <input
      #fileInput
      type="file"
      class="hidden"
      accept=".pdf,.png,.jpg,.jpeg"
      (change)="onFileSelected($event)"
    />

    <div class="flex items-end gap-3 w-full">
      <!-- Left action buttons -->
      <div class="flex items-center gap-1.5 shrink-0">
        <button
          class="flex h-8 w-8 items-center justify-center rounded-full text-muted transition-all duration-300 hover:bg-hover hover:text-ink hover:-translate-y-0.5 hover:scale-110 disabled:opacity-30 disabled:hover:transform-none"
          type="button"
          aria-label="Attach file"
          [disabled]="isUploading()"
          (click)="triggerFileUpload(fileInput)"
        >
          @if (isUploading()) {
            <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 12a8 8 0 018-8V2.5" />
            </svg>
          } @else {
            <svg [lucideIcon]="icons.Paperclip" class="h-[17px] w-[17px]"></svg>
          }
        </button>
        <button
          class="flex h-8 w-8 items-center justify-center rounded-full text-muted transition-all duration-300 hover:bg-hover hover:text-ink hover:-translate-y-0.5 hover:scale-110"
          type="button"
          aria-label="Voice input (coming soon)"
          (click)="showVoiceToast()"
        >
          <svg [lucideIcon]="icons.Mic" class="h-[17px] w-[17px]"></svg>
        </button>
      </div>

      <!-- Textarea -->
      <textarea
        #composerTextarea
        class="max-h-[200px] min-h-[32px] flex-1 resize-none border-0 bg-transparent py-1 text-[15px] font-normal leading-relaxed text-ink outline-none placeholder:text-muted scrollbar-hide"
        placeholder="Ask anything about medicine..."
        [ngModel]="prompt()"
        (ngModelChange)="prompt.set($event)"
        (keydown)="onKeyDown($event, composerTextarea)"
      ></textarea>

      <!-- Send / Stop button -->
      <div class="flex items-center shrink-0">
        @if (isStreaming()) {
          <button
            class="flex h-8 w-8 items-center justify-center rounded-full bg-error/90 text-white transition hover:bg-error shadow-sm"
            (click)="stopped.emit()"
            aria-label="Stop generating"
            type="button"
          >
            <svg [lucideIcon]="icons.Square" class="h-3 w-3 fill-current"></svg>
          </button>
        } @else {
          <button
            class="flex h-8 w-8 items-center justify-center rounded-full bg-gradient-to-r from-accent to-emerald-400 text-white transition-all duration-300 hover:scale-110 active:scale-95 disabled:opacity-35 disabled:from-surface disabled:to-surface disabled:text-muted disabled:border disabled:border-line disabled:shadow-none disabled:hover:transform-none shadow-[0_0_15px_rgba(20,184,166,0.3)] hover:shadow-[0_0_25px_rgba(20,184,166,0.5)]"
            [disabled]="!prompt().trim() && !isUploading()"
            (click)="send()"
            aria-label="Send message"
            type="button"
          >
            <svg [lucideIcon]="icons.ArrowUp" class="h-[17px] w-[17px] stroke-[2.5]"></svg>
          </button>
        }
      </div>
    </div>
  </div>

  @if (isUploading()) {
    <div class="mt-1 px-1">
      <div class="h-[3px] overflow-hidden rounded-full bg-surface border border-line">
        <div class="h-full bg-accent rounded-full transition-all duration-200" [style.width.%]="uploadProgress()"></div>
      </div>
    </div>
  }
</div>
