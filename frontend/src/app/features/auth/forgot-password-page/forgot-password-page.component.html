<div class="space-y-6 text-left">
  <div class="space-y-1.5 text-center mb-6">
    <h1 class="font-display text-2xl font-bold text-ink tracking-tight">Reset access</h1>
    <p class="text-sm text-muted">Enter your email to receive a password reset link.</p>
  </div>

  <form class="auth-form" (ngSubmit)="submit()" novalidate>
    <div class="field-group">
      <label for="email">Email address</label>
      <!-- Icon adornment — matches login-page pattern -->
      <div class="relative">
        <input
          id="email"
          class="has-icon"
          [class.border-error]="emailField.invalid && (emailField.dirty || emailField.touched || submitted())"
          type="email"
          placeholder="student@college.edu"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          required
          email
          autofocus
          #emailField="ngModel"
        />
        <svg [lucideIcon]="icons.Mail" class="input-icon"></svg>
      </div>
      @if (emailField.invalid && (emailField.dirty || emailField.touched || submitted())) {
        <!-- Bug fix: was <span>!</span> text character -->
        <p class="mt-1 text-xs font-medium text-error flex items-center gap-1.5 animate-fade-in">
          <svg [lucideIcon]="icons.AlertCircle" class="h-3.5 w-3.5"></svg> Valid email required.
        </p>
      }
    </div>

    <button class="primary-button w-full mt-2" type="submit" [disabled]="isSubmitting()">
      @if (isSubmitting()) {
        <svg class="h-4 w-4 animate-spin text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 12a8 8 0 018-8V2.5" />
        </svg>
      }
      {{ isSubmitting() ? 'Sending link...' : 'Send Reset Link' }}
    </button>
  </form>

  @if (statusMessage()) {
    <!-- Bug fix: was bg-red-500/10 text-red-600 (hardcoded Tailwind palette, not theme token).
         Fixed to bg-error/10 text-error which adapts correctly in dark mode. -->
    <div
      class="mt-5 flex items-start gap-2 rounded-xl p-3 animate-fade-in"
      [class.bg-success/10]="statusType() === 'success'"
      [class.border]="true"
      [class.border-success/20]="statusType() === 'success'"
      [class.text-success]="statusType() === 'success'"
      [class.bg-error/10]="statusType() === 'error'"
      [class.border-error/20]="statusType() === 'error'"
      [class.text-error]="statusType() === 'error'"
      [class.bg-ink/5]="statusType() !== 'success' && statusType() !== 'error'"
      [class.border-line]="statusType() !== 'success' && statusType() !== 'error'"
      [class.text-secondary]="statusType() !== 'success' && statusType() !== 'error'"
      aria-live="polite"
      role="status"
    >
      <svg [lucideIcon]="statusType() === 'error' ? icons.AlertCircle : icons.CheckCircle2" class="h-4 w-4 shrink-0 mt-0.5"></svg>
      <p class="text-[13px] font-medium leading-relaxed">{{ statusMessage() }}</p>
    </div>
  }

  <p class="mt-6 text-center text-[13px] font-medium text-ink/60">
    Remembered it?
    <a class="font-bold text-ink hover:text-accent transition-colors" routerLink="/auth/login">Return to sign in</a>
  </p>
</div>
